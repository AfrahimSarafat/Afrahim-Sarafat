<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afrahim Sarafat — Portfolio</title>
    <meta name="description" content="Portfolio of Afrahim Sarafat — Product Designer & Art Director crafting calm, useful digital products and brand systems." />
    <meta property="og:title" content="Afrahim Sarafat — Portfolio" />
    <meta property="og:description" content="Portfolio of Afrahim Sarafat — Product Designer & Art Director crafting calm, useful digital products and brand systems." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Instant Preconnect & DNS-Prefetch for External CDNs & Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://i.ibb.co" />
    <link rel="dns-prefetch" href="https://i.ibb.co" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="dns-prefetch" href="https://i.ytimg.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- High-Priority Preload for Hero Portrait Photo (Instant Display) -->
    <link
      rel="preload"
      as="image"
      href="https://i.ibb.co/DHvB5K2D/Chat-GPT-Image-Jul-28-2026-04-36-21-PM.png"
      fetchpriority="high"
    />

    <!-- Google Fonts with display=swap for zero render blocking -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Instant Theme Application Script to Prevent Any Layout or Color Shift -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('hmsharafat_portfolio_theme');
          if (saved === 'night' || saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
            document.documentElement.classList.add(saved);
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f7f4ec] text-[#1c2321] antialiased selection:bg-[#e79d1a] selection:text-[#0e261f]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
